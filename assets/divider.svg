<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 16" width="1200" height="16" role="presentation">
  
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04020D"/>
      <stop offset="0.55" stop-color="#0B0724"/>
      <stop offset="1" stop-color="#140B3A"/>
    </linearGradient>
    <radialGradient id="nebV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B2FF7" stop-opacity="0.75"/><stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebP" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F72585" stop-opacity="0.7"/><stop offset="1" stop-color="#F72585" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.55"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#F6A6D8"/><stop offset="0.35" stop-color="#F72585"/>
      <stop offset="0.75" stop-color="#7B2FF7"/><stop offset="1" stop-color="#1A0B3D"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#E9EEF7"/><stop offset="0.6" stop-color="#A9B6CC"/><stop offset="1" stop-color="#4A5468"/>
    </radialGradient>
    <radialGradient id="atmo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.82" stop-color="#00D9FF" stop-opacity="0"/><stop offset="0.93" stop-color="#00D9FF" stop-opacity="0.55"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0"/><stop offset="0.3" stop-color="#00D9FF" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="1" stop-color="#F72585" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7B2FF7"/><stop offset="0.5" stop-color="#F72585"/><stop offset="1" stop-color="#00D9FF"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0"/><stop offset="0.5" stop-color="#00D9FF" stop-opacity="0.9"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="100%" height="100%" rx="14"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="textglow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <style><![CDATA[
    .tw { animation: tw 3s ease-in-out infinite alternate; }
    @keyframes tw { from { opacity:.15 } to { opacity:1 } }
    .gl { animation: gl 4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes gl { from { opacity:.55; transform:scale(.85) } to { opacity:1; transform:scale(1.15) } }
    .shoot { animation: shoot 9s linear infinite; opacity:0; }
    .shoot.b { animation-duration: 13s; animation-delay: -6s; }
    @keyframes shoot {
      0%   { transform: translate(0,0);      opacity:0 }
      2%   { opacity:1 }
      9%   { transform: translate(420px,150px); opacity:0 }
      100% { transform: translate(420px,150px); opacity:0 }
    }
    .neb { animation: drift 24s ease-in-out infinite alternate; }
    .neb.b { animation-duration: 31s; animation-delay:-9s }
    .neb.c { animation-duration: 27s; animation-delay:-15s }
    @keyframes drift { from { transform: translate(0,0) } to { transform: translate(28px,-14px) } }
    .tag { font-family: Cascadia Code, Fira Code, JetBrains Mono, Consolas, Menlo, monospace; font-size:22px; font-weight:600; fill:#00D9FF; opacity:0; animation: cyc 15s infinite; }
    @keyframes cyc { 0%{opacity:0} 3%{opacity:1} 17%{opacity:1} 20%{opacity:0} 100%{opacity:0} }
    .comet { animation: comet 7s ease-in-out infinite; }
    @keyframes comet { 0%{ transform: translateX(-60px); opacity:0 } 8%{opacity:1} 92%{opacity:1} 100%{ transform: translateX(1260px); opacity:0 } }
  ]]></style>
