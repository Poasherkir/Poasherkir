name: Generate profile summary cards

# Saves the stats cards into this repo, so the README never shows a
# rate-limit error card from the public API.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate summary card SVGs
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          NAME: "Malik Boudine"
          BRANCH_NAME: main
          UTC_OFFSET: 1
          THEME: radical
          ANIMATION: load
          AUTO_PUSH: false

      - name: Commit the generated images
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-summary-card-output
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: refresh profile summary cards"
          git pull --rebase origin main
          git push
